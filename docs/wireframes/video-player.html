<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Inception - Movie Hub</title>
    <meta name="description" content="Watch Inception on Movie Hub.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">

    <!-- Stylesheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="player-body">
    <!-- Video Player Container -->
    <div class="video-player-container">
        <!-- Video Area -->
        <div class="video-area">
            <img src="https://placehold.co/1920x1080/000000/666666?text=Video+Playing" alt="Video" class="video-placeholder">

            <!-- Video Overlay -->
            <div class="video-overlay" id="video-overlay">
                <!-- Top Controls -->
                <div class="player-top-controls">
                    <button class="back-to-browse-btn" onclick="window.location.href='movie-detail.html'">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M19 12H5M12 19l-7-7 7-7"/>
                        </svg>
                    </button>

                    <div class="video-title-info">
                        <h1 class="video-title">Inception</h1>
                        <span class="video-episode-info">2010 • 2h 28m</span>
                    </div>
                </div>

                <!-- Center Play Button -->
                <div class="center-controls">
                    <button class="play-pause-center" id="play-pause-center">
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor" class="play-icon">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                        <svg width="80" height="80" viewBox="0 0 24 24" fill="currentColor" class="pause-icon" style="display: none;">
                            <rect x="6" y="4" width="4" height="16"></rect>
                            <rect x="14" y="4" width="4" height="16"></rect>
                        </svg>
                    </button>
                </div>

                <!-- Bottom Controls -->
                <div class="player-bottom-controls">
                    <!-- Progress Bar -->
                    <div class="progress-container">
                        <input type="range" min="0" max="100" value="35" class="progress-slider" id="progress-slider">
                        <div class="progress-time">
                            <span class="current-time">0:52:15</span>
                            <span class="total-time">2:28:00</span>
                        </div>
                    </div>

                    <!-- Control Buttons -->
                    <div class="player-controls">
                        <div class="controls-left">
                            <button class="control-btn play-pause-btn" id="play-pause-btn">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="play-icon">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" class="pause-icon" style="display: none;">
                                    <rect x="6" y="4" width="4" height="16"></rect>
                                    <rect x="14" y="4" width="4" height="16"></rect>
                                </svg>
                            </button>

                            <button class="control-btn" id="rewind-btn" title="Rewind 10s">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M2.5 2v6h6M2.66 15.57a10 10 0 1 0 .57-8.38"/>
                                </svg>
                                <span class="btn-label">10</span>
                            </button>

                            <button class="control-btn" id="forward-btn" title="Forward 10s">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38"/>
                                </svg>
                                <span class="btn-label">10</span>
                            </button>

                            <div class="volume-control">
                                <button class="control-btn volume-btn" id="volume-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="volume-high-icon">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                                    </svg>
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="volume-mute-icon" style="display: none;">
                                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                        <line x1="23" y1="9" x2="17" y2="15"></line>
                                        <line x1="17" y1="9" x2="23" y2="15"></line>
                                    </svg>
                                </button>
                                <input type="range" min="0" max="100" value="70" class="volume-slider" id="volume-slider">
                            </div>
                        </div>

                        <div class="controls-right">
                            <button class="control-btn" id="quality-btn" title="Quality">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M12 16v-4M12 8h.01"></path>
                                </svg>
                                <span class="btn-label-small">1080p</span>
                            </button>

                            <button class="control-btn" id="subtitle-btn" title="Subtitles">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <rect x="2" y="4" width="20" height="16" rx="2"></rect>
                                    <line x1="6" y1="12" x2="10" y2="12"></line>
                                    <line x1="14" y1="12" x2="18" y2="12"></line>
                                    <line x1="6" y1="16" x2="14" y2="16"></line>
                                </svg>
                            </button>

                            <button class="control-btn" id="fullscreen-btn" title="Fullscreen">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="expand-icon">
                                    <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
                                </svg>
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="compress-icon" style="display: none;">
                                    <path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 1 2-2h3M3 16h3a2 2 0 0 1 2 2v3"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Skip Intro Button -->
                <div class="skip-intro-container" id="skip-intro-container">
                    <button class="skip-intro-btn">
                        Skip Intro
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Next Episode Overlay (for TV shows) -->
            <div class="next-episode-overlay" id="next-episode-overlay" style="display: none;">
                <div class="next-episode-content">
                    <div class="next-episode-info">
                        <h3>Next Episode</h3>
                        <h4>Episode 2: The Dream Heist</h4>
                        <p>Starting in <span id="countdown">15</span>s</p>
                    </div>
                    <button class="btn btn-primary">Play Now</button>
                    <button class="btn btn-secondary cancel-next-btn">Cancel</button>
                </div>
            </div>
        </div>

        <!-- Episode Sidebar (for TV shows) -->
        <div class="episode-sidebar" id="episode-sidebar">
            <div class="sidebar-header">
                <h2 class="sidebar-title">Episodes</h2>
                <button class="close-sidebar-btn" id="close-sidebar-btn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <div class="season-selector">
                <button class="season-btn active">Season 1</button>
                <button class="season-btn">Season 2</button>
                <button class="season-btn">Season 3</button>
            </div>

            <div class="episodes-list">
                <div class="episode-item active">
                    <img src="https://placehold.co/160x90/1a1a1a/666666?text=Ep+1" alt="Episode 1" class="episode-thumbnail">
                    <div class="episode-info">
                        <h4 class="episode-number">1. Pilot</h4>
                        <p class="episode-duration">48m</p>
                        <div class="episode-progress-bar">
                            <div class="episode-progress-fill" style="width: 65%"></div>
                        </div>
                    </div>
                </div>

                <div class="episode-item">
                    <img src="https://placehold.co/160x90/1a1a1a/666666?text=Ep+2" alt="Episode 2" class="episode-thumbnail">
                    <div class="episode-info">
                        <h4 class="episode-number">2. The Dream Heist</h4>
                        <p class="episode-duration">52m</p>
                    </div>
                </div>

                <div class="episode-item">
                    <img src="https://placehold.co/160x90/1a1a1a/666666?text=Ep+3" alt="Episode 3" class="episode-thumbnail">
                    <div class="episode-info">
                        <h4 class="episode-number">3. Limbo</h4>
                        <p class="episode-duration">50m</p>
                    </div>
                </div>

                <div class="episode-item">
                    <img src="https://placehold.co/160x90/1a1a1a/666666?text=Ep+4" alt="Episode 4" class="episode-thumbnail">
                    <div class="episode-info">
                        <h4 class="episode-number">4. The Architect</h4>
                        <p class="episode-duration">55m</p>
                    </div>
                </div>

                <div class="episode-item">
                    <img src="https://placehold.co/160x90/1a1a1a/666666?text=Ep+5" alt="Episode 5" class="episode-thumbnail">
                    <div class="episode-info">
                        <h4 class="episode-number">5. Reality Check</h4>
                        <p class="episode-duration">47m</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Toggle Episode Sidebar Button -->
        <button class="toggle-episodes-btn" id="toggle-episodes-btn" title="Show episodes">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="9" y1="3" x2="9" y2="21"></line>
            </svg>
        </button>

        <!-- Quality Menu -->
        <div class="player-menu" id="quality-menu" style="display: none;">
            <div class="menu-header">
                <h3>Quality</h3>
                <button class="close-menu-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="menu-options">
                <button class="menu-option">Auto</button>
                <button class="menu-option active">1080p (Full HD)</button>
                <button class="menu-option">720p (HD)</button>
                <button class="menu-option">480p (SD)</button>
            </div>
        </div>

        <!-- Subtitle Menu -->
        <div class="player-menu" id="subtitle-menu" style="display: none;">
            <div class="menu-header">
                <h3>Subtitles/CC</h3>
                <button class="close-menu-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="menu-options">
                <button class="menu-option active">Off</button>
                <button class="menu-option">English</button>
                <button class="menu-option">Spanish</button>
                <button class="menu-option">French</button>
                <button class="menu-option">German</button>
                <button class="menu-option">Vietnamese</button>
            </div>
        </div>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
